name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # The project rules in CLAUDE.md are enforced here. This step is the gate.
      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Integration tests
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: pnpm run test

      - name: Report skipped integration tests
        if: ${{ env.TEST_DATABASE_URL == '' }}
        run: echo "::warning::TEST_DATABASE_URL secret is not set - integration tests were skipped."
